<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Dateien hochladen</title>
  <link rel="stylesheet" href="style.css">
  <!-- 👇 Responsives Design für Handys -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
  <div class="container">
    <h1>🎥 Fotos & Videos hochladen</h1>
    <p>Teilt gerne eure schönsten Aufnahmen, die ihr den Tag über gemacht habt!</p>

    <input type="file" id="fileInput" multiple accept="image/*,video/*">
    <button onclick="uploadFiles()">Hochladen</button>

    <button onclick="goBack()">Zurück</button>

    <p id="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="upload.js"></script>
</body>
</html>
