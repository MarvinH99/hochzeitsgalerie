<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Hochzeitsseite</title>
  <link rel="stylesheet" href="style.css">
  <!-- 👇 Responsives Design für Handys -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="container">
    
    <div id="passwordSection">
      <h1>Wir heiraten - und ihr seid dabei!</h1>
      <h2>Wir freuen uns darauf, diesen besonderen Tag gemeinsam mit euch zu feiern!</h2>

      <br><br>

      <p>Bitte Passwort eingeben:</p>
      <input type="password" id="passwordInput"> <br>
      <button onclick="checkPassword()">Weiter</button>
      <p id="passwordStatus"></p>
    <h2 id="countdown"></h2>

    </div>

    <div id="menuSection" style="display:none;">
      <!-- <p>Willkommen! Wähle eine Option:</p> -->
      <button onclick="goToSchedule()">📋 Tagesablauf</button>
      <button onclick="goToSchedule()">🚗 Anfahrt und Parken</button>
      <button onclick="goToUpload()">🎥 Fotos/Videos hochladen</button>
      <button onclick="goToGallery()">🖼️ Galerie anschauen</button>
      <button onclick="goToPhotographer()">📷 Fotos vom Fotografen</button>
      <button onclick="goToSpotify()">🎵 Musikwünsche</button>
      <!-- <img src="images/Miriam&Marvin.jpeg" alt="Hochzeitsbild" style="width:80%; margin-top:20px; border-radius:12px;"> -->
    
    </div>
  </div>

  <script>
  const correctPassword = "1";

  function showMenu() {
    document.getElementById("passwordSection").style.display = "none";
    document.getElementById("menuSection").style.display = "block";
  }

  function goToSchedule() {
  window.location.href = "schedule.html";
}

function goToPhotographer() {
  window.location.href = "photographer.html";
}

function goToSpotify() {
  window.location.href = "spotify.html";
}

function goToDirections() {
  window.location.href = "anfahrt.html";
}

  function checkPassword() {
    const input = document.getElementById("passwordInput").value;
    const status = document.getElementById("passwordStatus");

    if (input === correctPassword) {
      sessionStorage.setItem("authorized", "true");
      showMenu();
    } else {
      status.textContent = "Falsches Passwort 😕";
    }
  }

  function goToUpload() {
    window.location.href = "upload.html";
  }

  function goToGallery() {
    window.location.href = "gallery.html";
  }




// 🔥 Datum der Hochzeit anpassen
const weddingDate = new Date("2026-08-01T11:00:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const distance = weddingDate - now;

  const countdownEl = document.getElementById("countdown");

  if (distance <= 0) {
    countdownEl.innerHTML = "Just married 💍";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  countdownEl.innerHTML =
    `⏳ Noch ${days} Tage ${hours} Std. ${minutes} Min. ${seconds} Sek.`;
}

// jede Sekunde aktualisieren
setInterval(updateCountdown, 1000);
updateCountdown();


  // ✅ WARTET, bis die Seite geladen ist
  window.addEventListener("DOMContentLoaded", () => {
    if (sessionStorage.getItem("authorized") === "true") {
      showMenu();
    }
  });
</script>

</body>
</html>
